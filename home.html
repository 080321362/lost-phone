<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>失物招领 · 主屏</title>
<meta name="theme-color" content="#0b0e13">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div class="phone">
    <div class="statusbar dark">
      <span id="clock">22:14</span>
      <span class="right"><span>5G</span><span class="battery"></span></span>
    </div>

    <div class="screen home">
      <div class="home-head">
        <div>
          <h1>晚上好</h1>
          <p>这部手机是在出租车上捡到的</p>
        </div>
        <div class="badge" id="clueBadge">线索 1/6</div>
      </div>

      <div class="app-grid">
        <a class="app" href="chat.html">
          <span class="icon i-chat">💬</span><span>聊天</span>
        </a>
        <a class="app" href="notes.html">
          <span class="icon i-notes">📝</span><span>备忘录</span>
        </a>
        <a class="app" href="photos.html">
          <span class="icon i-photo">🖼️</span><span>相册</span>
        </a>
        <a class="app" href="calls.html">
          <span class="icon i-call">📞</span><span>通话</span>
        </a>
        <a class="app" href="mail.html">
          <span class="icon i-mail">✉️</span><span>邮件</span>
        </a>
        <a class="app" href="browser.html">
          <span class="icon i-web">🌐</span><span>浏览器</span>
        </a>
        <a class="app" href="ending.html">
          <span class="icon i-set">⚙️</span><span>关于</span>
        </a>
      </div>

      <div class="widget">
        <div class="w-top"><span>日历</span><span>明天</span></div>
        <div class="w-main">妈妈的生日</div>
        <div class="w-sub">晚上六点 · 回家吃饭</div>
        <div class="w-bar"></div>
      </div>

      <div class="home-foot">
        <b>失物招领</b><br>
        你在后座缝隙里发现了它，壳上贴着一张小纸条：<br>
        「捡到请联系我，谢谢。」<br><br>
        手机没有设远程锁定，还能打开。机主似乎不打算回来了。
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
