<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>失物招领 · 封面</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Noto Sans SC", "PingFang SC", sans-serif;
    background:
      radial-gradient(60% 80% at 78% 30%, rgba(210, 150, 80, .28), transparent 60%),
      radial-gradient(50% 60% at 10% 90%, rgba(70, 100, 130, .25), transparent 60%),
      #0b0e13;
    color: #f2ece1;
    display: flex; align-items: center;
    position: relative;
  }
  .grain {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
    pointer-events: none;
  }
  .copy { padding-left: 84px; width: 58%; position: relative; z-index: 2; }
  .kicker {
    font-size: 13px; letter-spacing: .35em; color: #c99a5a;
    text-transform: uppercase; margin-bottom: 22px;
  }
  h1 {
    font-size: 92px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(180deg, #fff9ef, #d9c4a5);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub {
    margin-top: 20px; font-size: 24px; color: #cfc4b4; font-weight: 400;
  }
  .desc {
    margin-top: 26px; font-size: 16px; line-height: 1.9; color: #9d9486; max-width: 560px;
  }
  .tags { margin-top: 34px; display: flex; gap: 10px; flex-wrap: wrap; }
  .tag {
    font-size: 13px; color: #e6d6bd; border: 1px solid #4a4034;
    background: rgba(255,255,255,.035); padding: 8px 14px; border-radius: 999px;
  }
  .phone-wrap {
    position: absolute; right: 78px; top: 50%; transform: translateY(-50%) rotate(-6deg);
    z-index: 2;
  }
  .phone {
    width: 268px; height: 540px; border-radius: 38px;
    background: linear-gradient(180deg, #2b3b4f 0%, #5b5f63 45%, #8a6b52 72%, #3b2e28 100%);
    box-shadow: 0 0 0 8px #14181e, 0 0 0 10px #2f353d, 0 40px 90px rgba(0,0,0,.65);
    position: relative; overflow: hidden;
  }
  .phone::before {
    content: ""; position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
    width: 84px; height: 22px; border-radius: 12px; background: #0b0d10;
  }
  .phone .clock {
    margin-top: 96px; text-align: center; font-size: 52px; font-weight: 200; color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,.35);
  }
  .phone .date { text-align: center; font-size: 11px; color: rgba(255,255,255,.85); margin-top: 4px; }
  .phone .notif {
    margin: 22px 16px 0; background: rgba(245, 240, 232, .9); color: #222;
    border-radius: 14px; padding: 10px 12px;
  }
  .phone .notif .t { font-size: 8px; font-weight: 700; color: #7a7268; letter-spacing: .08em; display: flex; justify-content: space-between; }
  .phone .notif .b { font-size: 11px; margin-top: 3px; }
  .phone .cake {
    margin-top: 7px; height: 40px; border-radius: 8px;
    background: linear-gradient(180deg, #f7d9b0, #e9b779);
    box-shadow: inset 0 -7px 0 #c98a4b;
    display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #8a4d1c;
  }
  .phone .hint { text-align: center; font-size: 9px; color: rgba(255,255,255,.8); margin-top: 26px; }
  .phone .dots { display: flex; justify-content: center; gap: 12px; margin-top: 9px; }
  .phone .dot { width: 8px; height: 8px; border: 1px solid rgba(255,255,255,.8); border-radius: 50%; }
  .phone .keys {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px;
    padding: 20px 26px 0;
  }
  .phone .k {
    height: 44px; border-radius: 50%; background: rgba(255,255,255,.14);
    display: grid; place-items: center; font-size: 16px; color: #fff; font-weight: 300;
  }
  .glow {
    position: absolute; right: 20px; top: 40%; width: 460px; height: 460px;
    background: radial-gradient(circle, rgba(210, 150, 80, .22), transparent 65%);
    filter: blur(20px); z-index: 1;
  }
  .corner { position: absolute; left: 84px; bottom: 54px; font-size: 12px; color: #6f675b; letter-spacing: .18em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grain"></div>
  <div class="copy">
    <div class="kicker">Web Puzzle · Two Endings</div>
    <h1>失物<br>招领</h1>
    <div class="sub">一部旧手机里的三个谜题</div>
    <div class="desc">你在出租车的后座捡到一部手机。<br>锁屏还亮着，明天是机主妈妈的生日。</div>
    <div class="tags">
      <span class="tag">网页解谜</span>
      <span class="tag">15–20 分钟</span>
      <span class="tag">双结局</span>
      <span class="tag">手机 / PC</span>
    </div>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="clock">21:47</div>
      <div class="date">3月16日 星期六</div>
      <div class="notif">
        <div class="t"><span>日历</span><span>现在</span></div>
        <div class="b">明天是妈妈的生日，别忘了。</div>
        <div class="cake">3·17</div>
      </div>
      <div class="hint">输入四位锁屏密码</div>
      <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      <div class="keys">
        <div class="k">1</div><div class="k">2</div><div class="k">3</div>
        <div class="k">4</div><div class="k">5</div><div class="k">6</div>
        <div class="k">7</div><div class="k">8</div><div class="k">9</div>
      </div>
    </div>
  </div>
  <div class="corner">LOST PHONE · A MINI ARG</div>
</body>
</html>
