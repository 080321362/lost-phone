<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>备忘录 · 失物招领</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="notes">
  <div class="phone">
    <div class="statusbar dark">
      <span id="clock">21:54</span>
      <span class="right"><span>5G</span><span class="battery"></span></span>
    </div>
    <div class="cluebar" id="clueBadge">线索 1/3</div>

    <div class="screen">
      <div class="screen-head">
        <a class="back" href="home.html">←</a>
        <div class="screen-title">备忘录</div>
        <div class="screen-sub">3 条</div>
      </div>
      <div class="screen-body">
        <div class="note" data-note="1">
          <button class="note-head">
            <span class="tag">待办</span>
            <span class="nt">这周</span>
            <span class="nd">3月15日</span>
          </button>
          <div class="note-body">
            给妈买降压药，还是原来那个牌子。<br>
            干洗店取外套，单子在玄关抽屉。<br>
            房租 15 号前转给王姐，别忘了。
          </div>
        </div>

        <div class="note" data-note="2">
          <button class="note-head">
            <span class="tag">工作</span>
            <span class="nt">交接清单</span>
            <span class="nd">3月12日</span>
          </button>
          <div class="note-body">
            拾光书店，钥匙两把，一把给周店长。<br>
            窗台上那盆薄荷，隔天浇一次。<br>
            天台的门锁坏了，用手往上一抬就能开。<br>
            我已经跟店长说过了，做到月底。
          </div>
        </div>

        <div class="note" data-note="3">
          <button class="note-head">
            <span class="tag">私人</span>
            <span class="nt">如果</span>
            <span class="nd">3月14日</span>
          </button>
          <div class="note-body">
            如果有一天我不见了，别找我。<br>
            我只是想一个人待几天，把一些事情想清楚。<br>
            别报警，也别告诉妈。<br><br>
            老地方我很熟，不会有事的。
          </div>
        </div>

        <p class="small" style="margin-top:18px">
          点开一条即可展开，看过的会自动记住。
        </p>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
