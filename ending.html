<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>结局 · 失物招领</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="ending">
  <div class="phone">
    <div class="screen ending-screen">
      <div class="ending-inner">
        <div class="ending-kicker">失物招领 · 结局</div>
        <div class="ending-title" id="endingTitle">23:00。你打算怎么办？</div>
        <div class="ending-text" id="endingText">
          <p>手机里的碎片已经拼出了一些东西：一个叫林知夏的人，一个叫林知遥的妹妹，一处叫「灯下读书会」的三楼，还有一条来自西河路 17 号的地址。</p>
          <p>现在快十一点了。那扇窗还亮着。</p>
          <p>你可以打 110，可以把手机交给妈妈，也可以自己过去。</p>
        </div>

        <div class="ending-actions" id="endingActions">
          <button class="btn" id="btnPolice">报警</button>
          <button class="btn amber" id="btnSelf">自己去西河路 17 号 3F</button>
          <button class="btn ghost" id="btnMom">把手机交给妈妈</button>
          <button class="btn ghost" id="btnOff">关机，不再管</button>
        </div>

        <div class="ending-actions" id="endingRetry" style="display:none">
          <button class="btn" id="btnRestart">重新开始</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
