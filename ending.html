<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>关于 · 失物招领</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="ending">
  <div class="phone">
    <div class="screen ending-screen">
      <div class="ending-inner">
        <div class="ending-kicker">失物招领 · 结局</div>
        <div class="ending-title" id="endingTitle">你打算怎么办？</div>
        <div class="ending-text" id="endingText">
          <p>手机里已经拼出了一些碎片：一个叫知夏的人，一家叫拾光的书店，还有一个总在等女儿回家的妈妈。</p>
          <p>明天是妈妈的生日。</p>
          <p>你可以用这部手机，打给那个被置顶的号码。</p>
        </div>

        <div class="ending-actions" id="endingActions">
          <button class="btn amber" id="btnReturn">打给妈妈，把手机还回去</button>
          <button class="btn ghost" id="btnKeep">关机，把它留下</button>
          <a class="btn ghost" href="home.html" style="text-align:center;text-decoration:none">再回去看看</a>
        </div>

        <div class="ending-actions" id="endingRetry" style="display:none">
          <button class="btn" id="btnRestart">重新开始</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
