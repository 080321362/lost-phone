<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相册 · 失物招领</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="photos">
  <div class="phone">
    <div class="statusbar dark">
      <span id="clock">21:58</span>
      <span class="right"><span>5G</span><span class="battery"></span></span>
    </div>
    <div class="cluebar" id="clueBadge">线索 1/3</div>

    <div class="screen">
      <div class="screen-head">
        <a class="back" href="home.html">←</a>
        <div class="screen-title">相册</div>
        <div class="screen-sub" id="photoCount">共 6 张</div>
      </div>
      <div class="screen-body">
        <div class="syncbar" id="syncbar">
          <span class="spinner"></span>
          <span id="syncText">正在同步相册…</span>
        </div>

        <div class="grid-3" id="photoGrid">
          <div class="tile t1" data-photo="1"><div class="inner"></div><span class="cap">书店门口 · 傍晚</span></div>
          <div class="tile t2" data-photo="2"><div class="inner"></div><span class="cap">窗台 · 薄荷</span></div>
          <div class="tile t3" data-photo="3"><div class="inner"></div><span class="cap">书店的猫</span></div>
          <div class="tile t4" data-photo="4"><div class="inner"></div><span class="cap">雨天的玻璃</span></div>
          <div class="tile t5" data-photo="5"><div class="inner"></div><span class="cap">一杯没喝完的咖啡</span></div>
          <div class="tile t6" data-photo="6"><div class="inner"></div><span class="cap">搬空一半的书架</span></div>
        </div>

        <p class="small" id="photoHint" style="margin-top:16px">
          相册还在同步，再进来看看。
        </p>
      </div>
    </div>

    <div class="viewer" id="viewer">
      <div class="frame">
        <div class="big" id="viewerImg"></div>
        <div class="desc" id="viewerDesc"></div>
        <button class="btn ghost" id="viewerClose" style="width:100%;margin-top:16px">关闭</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
